services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile.supervisor
    image: automata/supervisor:latest
    container_name: automata_supervisor
    depends_on:
      - ollama
    volumes:
      - .:/app:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ./AutomataEcosystem/data:/app/AutomataEcosystem/data
      - ./AutomataEcosystem/logs:/app/AutomataEcosystem/logs
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "8000:8000"
    restart: unless-stopped

  uae_template:
    build:
      context: .
      dockerfile: Dockerfile.uae
    image: automata/uae-template:latest
    container_name: automata_uae_template
    profiles: ["template"]
    command: ["python", "-m", "AutomataEcosystem.uae.main_agent"]
    volumes:
      - ./AutomataEcosystem/data:/app/AutomataEcosystem/data
      - ./AutomataEcosystem/logs:/app/AutomataEcosystem/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - SUPERVISOR_URL=http://automata_supervisor:8000
      - OLLAMA_URL=http://ollama:11434
    restart: "no"

  frontend:
    image: node:20
    container_name: automata_frontend
    working_dir: /app/client
    volumes:
      - .:/app:rw
    command: sh -c "apt-get update && apt-get install -y git && npm install -g pnpm && cd /app/client && pnpm install && pnpm dev --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=http://163.192.114.190:8000/api
      - VITE_ANALYTICS_ENDPOINT=http://163.192.114.190:8000/analytics
      - VITE_ANALYTICS_WEBSITE_ID=automata-id
      - OAUTH_SERVER_URL=http://163.192.114.190:8000
      - JWT_SECRET=changeme-supersecret
    ports:
      - "3000:3000"
    depends_on:
      - supervisor
