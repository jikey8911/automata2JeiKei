version: "3.9"

services:
  supervisor:
    image: python:3.11-slim
    container_name: automata_supervisor
    working_dir: /workspace
    volumes:
      - .:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket passthrough so Supervisor can manage UAE containers
      - ./AutomataEcosystem/data:/workspace/AutomataEcosystem/data  # Persist SQLite secrets/db
      - ./AutomataEcosystem/logs:/workspace/AutomataEcosystem/logs  # Persist Supervisor/OpenClaw logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "AutomataEcosystem.core.supervisor"]  # uvicorn started inside supervisor.main()
    ports:
      - "8000:8000"
    restart: unless-stopped

  uae_template:
    build:
      context: .
      dockerfile: Dockerfile.uae
    image: automata/uae-template:latest
    container_name: automata_uae_template
    profiles: ["template"]   # avoids autostart; Supervisor will clone/run as needed
    command: ["python", "-m", "AutomataEcosystem.uae.main_agent"]
    volumes:
      - ./AutomataEcosystem/data:/app/AutomataEcosystem/data  # shared secrets/DB if needed
      - ./AutomataEcosystem/logs:/app/AutomataEcosystem/logs  # shared logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: "no"

# Notes:
# - Expose additional ports in supervisor if you add an API (e.g., FastAPI at 8000:8000).
# - Ensure the host user has permission to access /var/run/docker.sock when running on local dev.
