services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: automata_db
    environment:
      POSTGRES_USER: automata
      POSTGRES_PASSWORD: automata_secure_password
      POSTGRES_DB: automata_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U automata -d automata_ai" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - automata_network

  # Ollama - LLM Local
  ollama:
    image: ollama/ollama:latest
    container_name: automata_ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      disable: true
    networks:
      - automata_network

  # Emulador Android (Fase 2)
  android:
    image: budtmo/docker-android:emulator_11.0
    container_name: automata_android
    privileged: true
    ports:
      - "5037:5037"
      - "4723:4723"
      - "6080:6080"
    environment:
      - DEVICE_PROPERTIES="ro.secure=0 ro.debuggable=1"
      - WEB_VNC=true
    volumes:
      - android_data:/data
    networks:
      - automata_network

  # Agente Python - Backend FastAPI
  agente:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: automata_agente
    environment:
      DATABASE_URL: postgresql://automata:automata_secure_password@db:5432/automata_ai
      OLLAMA_BASE_URL: http://ollama:11434
      APPIUM_URL: http://android:4723
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - automata_network
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend/Node - React Vite + Express TRPC
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automata_frontend
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://automata:automata_secure_password@db:5432/automata_ai
      - PORT=3000
      - VITE_OAUTH_PORTAL_URL=http://localhost:3000
      - VITE_APP_ID=local_dev
      - OAUTH_SERVER_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - automata_network

volumes:
  postgres_data:
  ollama_data:
  android_data:


networks:
  automata_network:
    driver: bridge
